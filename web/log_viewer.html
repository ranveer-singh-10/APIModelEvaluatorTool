<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eval Log Viewer</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e2e1dc;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --series-1: #2a78d6;
  --accent: #2a78d6;
  --accent-ink: #1d5fae;
  --accent-bg: #e8eefa;
  --grid: #e8e7e2;
  --critical: #b42318;
  --critical-bg: #fdecea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #232321;
    --border: #2f2f2c;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --accent: #3987e5;
    --accent-ink: #8ab8f0;
    --accent-bg: #1f2b3d;
    --grid: #2a2a27;
    --critical: #f07167;
    --critical-bg: #3a1d1b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211;
  --surface: #1a1a19;
  --surface-2: #232321;
  --border: #2f2f2c;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --series-1: #3987e5;
  --accent: #3987e5;
  --accent-ink: #8ab8f0;
  --accent-bg: #1f2b3d;
  --grid: #2a2a27;
  --critical: #f07167;
  --critical-bg: #3a1d1b;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.page { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 12px; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 16px; }
.source { color: var(--text-secondary); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; cursor: pointer;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn-link { border: none; background: none; color: var(--accent-ink); padding: 2px 4px; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }

.filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
.field input, .field select {
  border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 6px 8px;
  color: var(--text-primary); font-size: 14px;
}
.field-search { flex: 1 1 220px; }
.field-session select { max-width: min(360px, 100%); }
.session-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--text-secondary); margin: 0 0 8px; }
.session-line code { font-size: 12px; background: var(--surface-2); padding: 1px 6px; border-radius: 4px; color: var(--text-primary); }
.session-line .btn-link { padding: 0; font-size: 12px; }
.session-line .btn-link:hover { text-decoration: underline; }
.models-filter { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--text-primary); font-size: 13px; background: var(--bg); }
.chip input { margin: 0; accent-color: var(--accent); }

.notice { border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; border: 1px solid var(--border); background: var(--surface); }
.notice.error { border-color: var(--critical); background: var(--critical-bg); }
.notice code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile-label { font-size: 12px; color: var(--text-secondary); }
.tile-value { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
/* Columns marked text in MODEL_COLUMNS; the others are numbers */
th.text, td.text { text-align: left; }
th { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
th button { border: none; background: none; padding: 0; cursor: pointer; font-weight: 600; color: inherit; }
tbody tr:last-child td { border-bottom: none; }
.err-count { color: var(--critical); }

.charts { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 16px; }
.chart { margin: 0; min-width: 0; overflow-x: auto; }
.chart figcaption { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.chart svg { display: block; overflow: visible; }
.chart .bar { fill: var(--series-1); }
.chart .hit { fill: transparent; cursor: default; outline: none; }
.chart .row:hover .bar, .chart .row:focus-within .bar { opacity: 0.8; }
.chart .row:hover .hover-bg, .chart .row:focus-within .hover-bg { fill: var(--surface-2); }
.chart .hover-bg { fill: transparent; }
.chart .label { fill: var(--text-secondary); font-size: 12px; }
.chart .value { fill: var(--text-primary); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .muted { fill: var(--text-muted); font-size: 12px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--border); stroke-width: 1; }
.chart .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .axis-title { fill: var(--text-secondary); font-size: 11px; }
.chart .pass-line { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 4 4; }
.chart .dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.chart .point:hover .dot, .chart .point:focus-within .dot { stroke: var(--text-primary); }
.chart .point-label { fill: var(--text-secondary); font-size: 11px; }
.chart .note { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }

.tooltip {
  position: fixed; z-index: 10; pointer-events: none; display: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); max-width: 260px;
}
.tooltip strong { display: block; font-size: 13px; }
.tooltip .tt-sub { color: var(--text-secondary); }

.runs-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.runs-head h2 { margin: 0; }
.run { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--surface); overflow: hidden; }
.run-head {
  width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  border: none; background: none; text-align: left; padding: 12px 14px; cursor: pointer;
}
.run-head:hover { background: var(--surface-2); }
.run-time { font-weight: 600; }
.run-models { color: var(--text-secondary); }
.run-cost { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.chev { color: var(--text-muted); transition: transform 0.15s; }
.run-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent-ink); }
.badge-error { background: var(--critical-bg); color: var(--critical); }
.run-body { padding: 0 14px 14px; }
.prompt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text-secondary); }
.label-sm { font-size: 12px; color: var(--text-muted); margin: 10px 0 2px; }

.results { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 12px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
.results.single { grid-auto-flow: row; grid-auto-columns: auto; }
.result { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--bg); min-width: 0; display: flex; flex-direction: column; }
.result-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; margin: 0 0 10px; }
.metrics div { background: var(--surface); border-radius: 6px; padding: 4px 8px; }
.metrics dt { font-size: 11px; color: var(--text-muted); }
.metrics dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
.response { white-space: pre-wrap; overflow-wrap: anywhere; }
.badge-score { font-variant-numeric: tabular-nums; font-weight: 600; }
.badge-muted { background: var(--surface-2); color: var(--text-secondary); }
.grade { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; font-size: 13px; color: var(--text-secondary); overflow-wrap: anywhere; }
.grade strong { color: var(--text-primary); }
.grade.failed { color: var(--critical); }
.expected { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.error-box { border-radius: 8px; padding: 8px 10px; background: var(--critical-bg); color: var(--critical); overflow-wrap: anywhere; }
.empty { color: var(--text-secondary); padding: 8px 0; }

/* Explanations: any element with data-tip shows it on hover or focus; .info is a focusable ⓘ for headings */
.tip-bubble {
  position: fixed; z-index: 30; display: none; pointer-events: none; max-width: 280px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  font-size: 12px; line-height: 1.45; color: var(--text-primary); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
}
.info {
  display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px; padding: 0; vertical-align: 1px;
  border: 1px solid var(--border); border-radius: 50%; background: none; color: var(--text-muted);
  font: italic 600 11px/1 Georgia, serif; cursor: help;
}
.info:hover, .info:focus-visible { color: var(--accent-ink); border-color: var(--accent); }
.title-row { display: flex; align-items: center; }
.tile-label[data-tip], .chart figcaption[data-tip] { cursor: help; }

.drop-overlay {
  position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
  background: rgba(42, 120, 214, 0.15); border: 3px dashed var(--accent); font-size: 18px; font-weight: 600;
}
.drop-overlay.show { display: flex; }

@media (max-width: 640px) {
  .tile-value { font-size: 20px; }
  .run-cost { margin-left: 0; }
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <h1>Eval Log Viewer</h1>
      <div class="source" id="source">No log loaded</div>
    </div>
    <div class="actions">
      <button class="btn" id="reload" type="button" data-tip="Load logs/eval_log.json again from the server, to pick up runs logged since this page opened.">Reload</button>
      <button class="btn" id="open" type="button" data-tip="Open a log file from your computer instead. You can also drag a log file onto the page.">Open log file</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <button class="btn btn-primary" id="export" type="button" data-tip="Download the model calls that match the current filters as a CSV file, one row per call.">Export CSV</button>
      <button class="btn" id="theme" type="button" data-tip="Switch between light and dark mode. The choice is remembered in this browser."></button>
    </div>
  </div>

  <div id="notice" class="notice" hidden></div>

  <section class="panel" aria-label="Filters">
    <div class="filters">
      <label class="field field-search" data-tip="Shows only calls whose prompt, system prompt, response, error, model, provider, chat session id, batch or case id, expected answer, rubric, grader reasoning, or attachment or context file names contain this text. Not case-sensitive.">Search prompts and responses
        <input type="search" id="f-text" placeholder="e.g. quantum">
      </label>
      <label class="field" data-tip="Where the run came from: evaluate() for one model, evaluate_all_models() for a comparison, one case of an evaluate_batch() batch, or a turn sent from the chat page.">Run type
        <select id="f-type">
          <option value="all">All</option>
          <option value="evaluate">Single model (evaluate)</option>
          <option value="evaluate_all_models">All models (evaluate_all_models)</option>
          <option value="batch">Batch case (evaluate_batch)</option>
          <option value="chat">Chat page (chat_ui)</option>
        </select>
      </label>
      <label class="field field-session" data-tip="Show only the cases of one evaluate_batch() run. Each batch has its own id, printed when it finishes.">Batch
        <select id="f-batch">
          <option value="all">All</option>
        </select>
      </label>
      <label class="field field-session" data-tip="Show only the turns of one chat page conversation. Each conversation has its own session id, shown on the chat page.">Chat session
        <select id="f-session">
          <option value="all">All</option>
        </select>
      </label>
      <label class="field" data-tip="Show only one provider's models. The model checkboxes below then list just that provider's models.">Provider
        <select id="f-provider">
          <option value="all">All</option>
        </select>
      </label>
      <label class="field" data-tip="Show only calls that succeeded, or only calls that failed with an error.">Status
        <select id="f-status">
          <option value="all">All</option>
          <option value="ok">Succeeded</option>
          <option value="error">Errors</option>
        </select>
      </label>
      <label class="field" data-tip="Show only runs on or after this day, in your local time.">From
        <input type="date" id="f-from">
      </label>
      <label class="field" data-tip="Show only runs on or before this day, in your local time.">To
        <input type="date" id="f-to">
      </label>
      <button class="btn" id="f-clear" type="button" data-tip="Reset every filter, including the model checkboxes, so the whole log is shown.">Clear filters</button>
      <div class="models-filter" id="f-models"></div>
    </div>
  </section>

  <div class="tiles" id="tiles"></div>

  <section class="panel">
    <h2 class="title-row">Models<button type="button" class="info" aria-label="About the Models section" data-tip="One row per model, totalled over the calls that match the filters. Averages leave out failed calls and calls with no cost estimate. Scores are on a 1-5 scale and only scored calls count towards them. Click a column heading to sort by it. The charts compare the same averages.">i</button></h2>
    <div class="table-wrap" id="model-table"></div>
    <div class="charts" id="charts"></div>
  </section>

  <section class="panel">
    <div class="runs-head">
      <div class="title-row">
        <h2 id="runs-title">Runs</h2>
        <button type="button" class="info" aria-label="About the Runs section" data-tip="One card per logged run: an evaluate() call, an evaluate_all_models() comparison, one case of a batch or one chat page turn. Click a card to see the full prompt and every model's response, tokens and cost. Only the calls that match the filters are shown.">i</button>
      </div>
      <label class="field" data-tip="Order the run cards by time, or by what each run cost in total.">Sort
        <select id="run-sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="cost">Highest cost</option>
        </select>
      </label>
    </div>
    <div id="runs"></div>
  </section>
</div>

<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="drop-overlay" id="drop">Drop the log file to open it</div>

<script>
"use strict";

const $ = (sel) => document.querySelector(sel);
const SVG_NS = "http://www.w3.org/2000/svg";

// Builds DOM nodes. Strings become text nodes, so log content (model output) is never parsed as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  setAttrs(el, attrs);
  appendAll(el, children);
  return el;
}
function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  setAttrs(el, attrs);
  appendAll(el, children);
  return el;
}
function setAttrs(el, attrs) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.setAttribute("class", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
}
function appendAll(el, children) {
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
}

const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);

function fmtCost(v) {
  if (v == null) return "—";
  if (v === 0) return "$0";
  const a = Math.abs(v);
  return "$" + v.toFixed(a >= 1 ? 2 : a >= 0.01 ? 4 : 6);
}
const fmtSec = (v) => (v == null ? "—" : v.toFixed(2) + " s");
const fmtInt = (v) => (v == null ? "—" : Math.round(v).toLocaleString());
function fmtDate(d, raw) {
  if (!d) return raw || "Unknown time";
  return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}
function localDay(d) {
  if (!d) return "";
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

const state = {
  entries: [],
  rows: [],
  modelOrder: [],
  modelProvider: new Map(),
  source: "",
  excludedModels: new Set(),
  filters: { text: "", type: "all", session: "all", batch: "all", provider: "all", status: "all", from: "", to: "" },
  modelSort: { key: null, dir: 1 },
  runSort: "newest",
  expanded: new Set(),
  runLimit: 50,
  chartData: [],
};

// ---------- Loading ----------

// A prompt logged as a messages list is shown as its user text
function promptText(p) {
  if (p == null) return "";
  if (typeof p === "string") return p;
  if (Array.isArray(p)) {
    const parts = [];
    for (const m of p) {
      if (!m || m.role !== "user") continue;
      if (typeof m.content === "string") parts.push(m.content);
      else if (Array.isArray(m.content)) {
        for (const b of m.content) if (b && typeof b.text === "string") parts.push(b.text);
      }
    }
    if (parts.length) return parts.join("\n\n");
  }
  return JSON.stringify(p, null, 2);
}

// A system prompt logged as a list of blocks (e.g. with cache_control) is shown as its text
function systemText(s) {
  if (!s || (Array.isArray(s) && !s.length)) return "";
  if (typeof s === "string") return s;
  if (Array.isArray(s)) {
    const parts = s.filter((b) => b && typeof b.text === "string").map((b) => b.text);
    if (parts.length) return parts.join("\n\n");
  }
  return JSON.stringify(s, null, 2);
}

// Last resort for entries logged before results recorded a provider, when no other result for the model recorded one.
// This copies only the name-prefix fallback in evaluation.provider_for, so keep the two in step.
function inferProvider(model) {
  if (model.startsWith("claude-")) return "anthropic";
  if (/^(gpt-|o1|o3|o4)/.test(model)) return "openai";
  return "unknown";
}

// Stop reasons that mean the model finished normally, so no badge is shown
const NORMAL_STOPS = new Set(["end_turn", "completed"]);

function parseLog(text) {
  if (!text.trim()) return [];
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error("The log file is not valid JSON: " + e.message);
  }
}

// Text fields come straight from the log file, which may be hand-edited, so they are made strings before any string methods run.
// Objects are shown as JSON so their contents can still be read and searched. Missing, empty and false values
// get the fallback (so "error": false means no error); 0 is kept, except as an error, where it also means none.
const str = (v, fallback) =>
  v == null || v === "" || v === false ? fallback : typeof v === "object" ? JSON.stringify(v) : String(v);

// A chat turn's attachments are logged as {name, type, media_type, bytes}, without their data; shown as "name (type, size)"
function attachmentLabels(list) {
  if (!Array.isArray(list)) return [];
  const size = (n) => n == null ? "" : n < 1000 ? `, ${n} B` : n < 1_000_000 ? `, ${(n / 1000).toFixed(0)} KB` : `, ${(n / 1_000_000).toFixed(1)} MB`;
  return list.filter((a) => a && typeof a === "object").map((a) => `${str(a.name, "file")} (${str(a.type, "file")}${size(num(a.bytes))})`);
}

// Entries in a run's results that aren't objects (null, false, 0) are skipped everywhere, including the run's model count
const isResult = (r) => !!r && typeof r === "object";

// Scores are 1-5 (evaluation.score_response); a score of PASS_SCORE or more is a pass. Keep in step with evaluation.PASS_SCORE.
const SCORE_MAX = 5;
const PASS_SCORE = 4;
const fmtScore = (v) => (v == null ? "—" : v.toFixed(2));
const fmtPct = (v) => (v == null ? "—" : Math.round(v * 100) + "%");

// A result's score as logged: {value, scorer, reasoning, judge_model, judge_usage, error}, or null when it wasn't scored
function scoreFields(sc) {
  if (!sc || typeof sc !== "object") return { score: null, scored: false, scorer: null, reasoning: "", scoreError: null, judgeModel: null, judgeCost: null };
  const value = num(sc.value);
  const ju = sc.judge_usage && typeof sc.judge_usage === "object" ? sc.judge_usage : null;
  return {
    score: value != null && value >= 1 && value <= SCORE_MAX ? value : null,
    scored: true,
    scorer: str(sc.scorer, null),
    reasoning: str(sc.reasoning, ""),
    scoreError: str(sc.error, null),
    judgeModel: str(sc.judge_model, null),
    judgeCost: ju && ju.cost ? num(ju.cost.total_cost) : null,
  };
}

function loadEntries(data, source) {
  if (!Array.isArray(data)) throw new Error("The log should be a JSON array of runs.");
  state.entries = data;
  state.source = source;
  state.expanded.clear();
  state.runLimit = 50;
  state.rows = [];
  state.modelOrder = [];

  // The provider most recently recorded for each model, used for results that didn't record one
  const known = new Map();
  for (const e of data) {
    for (const r of Array.isArray(e && e.results) ? e.results : []) {
      if (!isResult(r)) continue;
      const m = str(r.model, null), p = str(r.provider, null);
      if (m != null && p != null) known.set(m, p);
    }
  }

  data.forEach((e, runId) => {
    const results = Array.isArray(e && e.results) ? e.results : [];
    const date = e && e.timestamp ? new Date(e.timestamp) : null;
    for (const r of results) {
      if (!isResult(r)) continue;
      const usage = r.usage || null;
      const cost = usage && usage.cost ? usage.cost : null;
      const model = str(r.model, "unknown");
      if (!state.modelOrder.includes(model)) state.modelOrder.push(model);
      state.rows.push({
        runId,
        timestamp: str(e.timestamp, ""),
        date: date && !isNaN(date) ? date : null,
        type: str(e.type, "unknown"),
        // A chat page conversation: every turn of one conversation shares its session_id
        sessionId: str(e.session_id, null),
        turn: num(e.turn),
        sessionTotal: num(e.session_total_cost),
        attachments: attachmentLabels(e.attachments),
        contextFiles: attachmentLabels(e.context_files),
        // One case of an evaluate_batch() run: every case of a batch shares its batch_id
        batchId: str(e.batch_id, null),
        caseId: str(e.case_id, null),
        expected: str(e.expected, ""),
        rubric: str(e.rubric, ""),
        ...scoreFields(r.score),
        prompt: promptText(e.prompt),
        system: systemText(e.system),
        model,
        provider: str(r.provider, known.get(model) || inferProvider(model)),
        seconds: num(r.seconds),
        stopReason: str(r.stop_reason, ""),
        response: str(r.response, ""),
        usage,
        cost,
        totalCost: cost ? num(cost.total_cost) : null,
        error: r.error === 0 ? null : str(r.error, null),
      });
    }
  });

  state.modelProvider = new Map();
  // Rows are in log order, so each model ends up with its newest provider, as in `known`
  for (const r of state.rows) state.modelProvider.set(r.model, r.provider);

  hideNotice();
  if (!data.length) showNotice("The log is empty. Run evaluate(...), evaluate_all_models(...) or evaluate_batch(...) with log=True, then press Reload.");
  renderSessionFilter();
  renderBatchFilter();
  renderProviderFilter();
  renderModelFilter();
  render();
}

async function loadFromServer() {
  if (!location.protocol.startsWith("http")) {
    showNotice("This page was opened from disk, so it can't load the log by itself. Use Open log file (or drag the file onto the page), or run view_logs() in Python.");
    $("#source").textContent = "No log loaded";
    render();
    return;
  }
  try {
    const res = await fetch("log.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`The server returned HTTP ${res.status}.`);
    loadEntries(parseLog(await res.text()), "Served by view_logs()");
  } catch (err) {
    showNotice(`Couldn't load the log: ${err.message} Make sure view_logs() is still running, or use Open log file.`, true);
  }
}

function loadFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      loadEntries(parseLog(String(reader.result)), file.name);
    } catch (err) {
      showNotice(err.message, true);
    }
  };
  reader.onerror = () => showNotice("Couldn't read that file.", true);
  reader.readAsText(file);
}

function showNotice(text, isError) {
  const n = $("#notice");
  n.textContent = text;
  n.className = isError ? "notice error" : "notice";
  n.hidden = false;
}
function hideNotice() {
  $("#notice").hidden = true;
}

// ---------- Filtering ----------

function filteredRows() {
  const f = state.filters;
  const q = f.text.trim().toLowerCase();
  return state.rows.filter((r) => {
    if (state.excludedModels.has(r.model)) return false;
    if (f.type !== "all" && r.type !== f.type) return false;
    if (f.session !== "all" && r.sessionId !== f.session) return false;
    if (f.batch !== "all" && r.batchId !== f.batch) return false;
    if (f.provider !== "all" && r.provider !== f.provider) return false;
    if (f.status === "ok" && r.error) return false;
    if (f.status === "error" && !r.error) return false;
    if (f.from || f.to) {
      const d = localDay(r.date);
      if (!d) return false;
      if (f.from && d < f.from) return false;
      if (f.to && d > f.to) return false;
    }
    if (q && ![r.prompt, r.system, r.response, r.error || "", r.model, r.provider, r.sessionId || "", r.batchId || "", r.caseId || "",
      r.expected, r.rubric, r.reasoning, r.attachments.join(" "), r.contextFiles.join(" ")].some((t) => t.toLowerCase().includes(q))) return false;
    return true;
  });
}

// One option per chat session in the log, newest first, labelled with its id, start time, turns and first prompt
function renderSessionFilter() {
  const sessions = new Map();
  state.entries.forEach((e, runId) => {
    const id = e && str(e.session_id, null);
    if (id == null) return;
    if (!sessions.has(id)) {
      const d = e.timestamp ? new Date(e.timestamp) : null;
      sessions.set(id, { id, runId, date: d && !isNaN(d) ? d : null, timestamp: str(e.timestamp, ""), prompt: promptText(e.prompt), turns: 0 });
    }
    sessions.get(id).turns += 1;
  });
  const list = [...sessions.values()].sort((a, b) =>
    (b.date ? b.date.getTime() : b.runId) - (a.date ? a.date.getTime() : a.runId) || b.runId - a.runId);

  const wanted = state.filters.session;
  if (wanted !== "all" && !sessions.has(wanted)) {
    showNotice(`Chat session ${wanted} isn't in this log, so all runs are shown.`);
    state.filters.session = "all";
    syncSessionUrl();
  }
  const short = (t) => { const one = t.replace(/\s+/g, " ").trim(); return one.length > 40 ? one.slice(0, 39) + "…" : one; };
  const select = $("#f-session");
  select.replaceChildren(
    h("option", { value: "all" }, sessions.size ? "All" : "All (no chat sessions logged)"),
    ...list.map((s) => h("option", { value: s.id, title: s.prompt },
      `${s.id} · ${fmtDate(s.date, s.timestamp)} · ${plural(s.turns, "turn")}${s.prompt ? " · " + short(s.prompt) : ""}`)),
  );
  select.value = state.filters.session;
}

// Keeps ?session=<id> in the address bar, so a filtered view can be bookmarked or opened from the chat page
function syncSessionUrl() {
  if (!location.protocol.startsWith("http")) return;
  const url = new URL(location.href);
  if (state.filters.session === "all") url.searchParams.delete("session");
  else url.searchParams.set("session", state.filters.session);
  history.replaceState(null, "", url);
}

function setSessionFilter(id) {
  state.filters.session = id;
  state.runLimit = 50;
  $("#f-session").value = id;
  syncSessionUrl();
  render();
}

// One option per evaluate_batch() run in the log, newest first, labelled with its id, start time and case count
function renderBatchFilter() {
  const batches = new Map();
  state.entries.forEach((e, runId) => {
    const id = e && str(e.batch_id, null);
    if (id == null) return;
    if (!batches.has(id)) {
      const d = e.timestamp ? new Date(e.timestamp) : null;
      batches.set(id, { id, runId, date: d && !isNaN(d) ? d : null, timestamp: str(e.timestamp, ""), cases: 0 });
    }
    batches.get(id).cases += 1;
  });
  const list = [...batches.values()].sort((a, b) =>
    (b.date ? b.date.getTime() : b.runId) - (a.date ? a.date.getTime() : a.runId) || b.runId - a.runId);
  if (!batches.has(state.filters.batch)) state.filters.batch = "all";
  const select = $("#f-batch");
  select.replaceChildren(
    h("option", { value: "all" }, batches.size ? "All" : "All (no batches logged)"),
    ...list.map((b) => h("option", { value: b.id }, `${b.id} · ${fmtDate(b.date, b.timestamp)} · ${plural(b.cases, "case")}`)),
  );
  select.value = state.filters.batch;
}

function setBatchFilter(id) {
  state.filters.batch = id;
  state.runLimit = 50;
  $("#f-batch").value = id;
  render();
}

const PROVIDER_LABELS = { anthropic: "Anthropic", openai: "OpenAI" };

// One option per provider in the log, so providers added later (and "unknown") can be picked too
function renderProviderFilter() {
  const select = $("#f-provider");
  const providers = [...new Set(state.rows.map((r) => r.provider))];
  if (!providers.includes(state.filters.provider)) state.filters.provider = "all";
  select.replaceChildren(
    h("option", { value: "all" }, "All"),
    ...providers.map((p) => h("option", { value: p }, PROVIDER_LABELS[p] || p)),
  );
  select.value = state.filters.provider;
}

// Models of the selected provider, so the checkboxes and All/None only cover models that can be shown
function visibleModels() {
  const p = state.filters.provider;
  return p === "all" ? state.modelOrder : state.modelOrder.filter((m) => state.modelProvider.get(m) === p);
}

function renderModelFilter() {
  const box = $("#f-models");
  box.replaceChildren();
  const models = visibleModels();
  if (!models.length) return;
  box.append(
    h("span", { "data-tip": "Untick a model to leave its calls out of the tiles, table, charts, runs and CSV export.", style: "cursor: help" }, "Models:"),
    ...models.map((m) =>
      h("label", { class: "chip" },
        h("input", {
          type: "checkbox",
          checked: !state.excludedModels.has(m),
          onchange: (e) => {
            if (e.target.checked) state.excludedModels.delete(m);
            else state.excludedModels.add(m);
            render();
          },
        }),
        m)
    ),
    h("button", { class: "btn-link", type: "button", "data-tip": "Tick every model listed here.", onclick: () => { models.forEach((m) => state.excludedModels.delete(m)); renderModelFilter(); render(); } }, "All"),
    h("button", { class: "btn-link", type: "button", "data-tip": "Untick every model listed here.", onclick: () => { models.forEach((m) => state.excludedModels.add(m)); renderModelFilter(); render(); } }, "None"),
  );
}

// ---------- Aggregation ----------

function aggregate(rows) {
  const byModel = new Map();
  for (const m of state.modelOrder) byModel.set(m, null);
  for (const r of rows) {
    let a = byModel.get(r.model);
    if (!a) {
      a = { model: r.model, provider: r.provider, calls: 0, errors: 0, costSum: 0, costN: 0, secSum: 0, secN: 0, outSum: 0, outN: 0,
            scoreSum: 0, scoreN: 0, passes: 0, scoredCostSum: 0, scoredCostN: 0 };
      byModel.set(r.model, a);
    }
    a.calls++;
    if (r.error) { a.errors++; continue; }
    if (r.totalCost != null) { a.costSum += r.totalCost; a.costN++; }
    if (r.seconds != null) { a.secSum += r.seconds; a.secN++; }
    const out = r.usage ? num(r.usage.output_tokens) : null;
    if (out != null) { a.outSum += out; a.outN++; }
    if (r.score != null) {
      a.scoreSum += r.score; a.scoreN++;
      if (r.score >= PASS_SCORE) a.passes++;
      // Cost per pass counts only scored calls, so unscored runs in the same filter don't inflate it
      if (r.totalCost != null) { a.scoredCostSum += r.totalCost; a.scoredCostN++; }
    }
  }
  return [...byModel.values()].filter(Boolean).map((a) => ({
    ...a,
    totalCost: a.costN ? a.costSum : null,
    avgCost: a.costN ? a.costSum / a.costN : null,
    avgSec: a.secN ? a.secSum / a.secN : null,
    avgOut: a.outN ? a.outSum / a.outN : null,
    avgScore: a.scoreN ? a.scoreSum / a.scoreN : null,
    passRate: a.scoreN ? a.passes / a.scoreN : null,
    costPerPass: a.passes && a.scoredCostN ? a.scoredCostSum / a.passes : null,
    // Average cost of the scored calls only: the x of the accuracy vs cost chart, so both axes cover the same calls
    avgScoredCost: a.scoredCostN ? a.scoredCostSum / a.scoredCostN : null,
  }));
}

// ---------- Rendering ----------

function render() {
  const rows = filteredRows();
  const runCount = new Set(rows.map((r) => r.runId)).size;
  $("#source").textContent = state.entries.length
    ? `${state.source} · ${plural(state.entries.length, "run")} in log`
    : state.source || "No log loaded";
  renderTiles(rows, runCount);
  const agg = aggregate(rows);
  renderModelTable(agg);
  renderCharts(agg);
  renderRuns(rows);
}

function renderTiles(rows, runCount) {
  const costs = rows.map((r) => r.totalCost).filter((v) => v != null);
  const spend = costs.reduce((a, b) => a + b, 0);
  const errors = rows.filter((r) => r.error).length;
  const tile = (label, value, tip) =>
    h("div", { class: "tile" }, h("div", { class: "tile-label", "data-tip": tip }, label), h("div", { class: "tile-value" }, value));
  $("#tiles").replaceChildren(
    tile("Runs", runCount.toLocaleString(), "How many logged runs have at least one call matching the filters. A run is one evaluate() call, one evaluate_all_models() comparison or one chat page turn."),
    tile("Model calls", rows.length.toLocaleString(), "How many individual model calls match the filters. A comparison across 5 models is one run but 5 calls."),
    tile("Total spend", fmtCost(costs.length ? spend : null), "The estimated cost of every matching call added together, from the prices in MODEL_PRICING. Calls to unpriced models aren't counted."),
    tile("Avg cost per call", fmtCost(costs.length ? spend / costs.length : null), "Total spend divided by the number of matching calls that have a cost estimate."),
    tile("Errors", errors.toLocaleString(), "How many matching calls failed, for example because a model was unavailable or the request was rejected."),
  );
  // Scoring tiles only once some matching call has been scored
  const scored = rows.filter((r) => !r.error && r.score != null);
  if (scored.length) {
    const avg = scored.reduce((a, r) => a + r.score, 0) / scored.length;
    const passes = scored.filter((r) => r.score >= PASS_SCORE).length;
    const judge = rows.map((r) => r.judgeCost).filter((v) => v != null);
    $("#tiles").append(
      tile("Avg score", `${fmtScore(avg)} / ${SCORE_MAX}`, `The average 1-5 score of the ${plural(scored.length, "scored call")} that match the filters. Failed calls and unscored calls aren't counted.`),
      tile("Pass rate", fmtPct(passes / scored.length), `The share of scored calls rated ${PASS_SCORE} or more out of ${SCORE_MAX}.`),
      tile("Grader spend", fmtCost(judge.length ? judge.reduce((a, b) => a + b, 0) : null), "What the grader model cost to score the matching calls. It isn't included in Total spend, which is what the evaluated models cost."),
    );
  }
}

// text columns are left-aligned and first sort ascending; the rest first sort highest first
const MODEL_COLUMNS = [
  { key: "model", label: "Model", fmt: (v) => v, text: true, tip: "The model's API id. Click to sort by name." },
  { key: "provider", label: "Provider", fmt: (v) => v, text: true, tip: "The company whose API served the model. Click to sort." },
  { key: "calls", label: "Calls", fmt: (v) => v.toLocaleString(), tip: "How many matching calls this model made, failed ones included. Click to sort." },
  { key: "errors", label: "Errors", fmt: (v) => v.toLocaleString(), tip: "How many of those calls failed. Click to sort." },
  { key: "totalCost", label: "Total cost", fmt: fmtCost, tip: "The estimated cost of all this model's matching calls. Click to sort." },
  { key: "avgCost", label: "Avg cost", fmt: fmtCost, tip: "Estimated cost per successful call. Longer prompts and answers cost more, so compare models on the same prompts. Click to sort." },
  { key: "avgSec", label: "Avg time", fmt: fmtSec, tip: "Seconds per successful call, from sending the request to receiving the whole response. Click to sort." },
  { key: "avgOut", label: "Avg output tokens", fmt: fmtInt, tip: "Output tokens per successful call. For OpenAI models this includes reasoning tokens, which are billed as output. Click to sort." },
  { key: "avgScore", label: "Avg score", fmt: fmtScore, score: true, tip: "The average 1-5 score of this model's scored calls, from the grader (llm_judge) or from exact / contains matching, which record a pass as 5 and a fail as 1. Click to sort." },
  { key: "passRate", label: "Pass rate", fmt: fmtPct, score: true, tip: `The share of this model's scored calls rated ${PASS_SCORE} or more out of ${SCORE_MAX}. Click to sort.` },
  { key: "costPerPass", label: "Cost per pass", fmt: fmtCost, score: true, tip: "What the model's scored calls cost, divided by how many of them passed: the price of one acceptable answer. Grading costs aren't included. Click to sort." },
];

function renderModelTable(agg) {
  const wrap = $("#model-table");
  if (!agg.length) {
    wrap.replaceChildren(h("p", { class: "empty" }, "No model calls match the filters."));
    return;
  }
  // The scoring columns appear only once some matching call has been scored
  const columns = agg.some((a) => a.scoreN) ? MODEL_COLUMNS : MODEL_COLUMNS.filter((c) => !c.score);
  const { key, dir } = state.modelSort;
  const rows = key && columns.some((c) => c.key === key) ? [...agg].sort((a, b) => compare(a[key], b[key]) * dir) : agg;
  const sortHeader = (col) => {
    const active = state.modelSort.key === col.key;
    const arrow = active ? (state.modelSort.dir === 1 ? " ▲" : " ▼") : "";
    return h("th", { scope: "col", class: col.text ? "text" : null, "aria-sort": active ? (state.modelSort.dir === 1 ? "ascending" : "descending") : null },
      h("button", {
        type: "button",
        "data-tip": col.tip,
        onclick: () => {
          state.modelSort = active ? { key: col.key, dir: -state.modelSort.dir } : { key: col.key, dir: col.text ? 1 : -1 };
          renderModelTable(agg);
        },
      }, col.label + arrow));
  };
  wrap.replaceChildren(
    h("table", {},
      h("thead", {}, h("tr", {}, columns.map(sortHeader))),
      h("tbody", {}, rows.map((a) =>
        h("tr", {}, columns.map((col) =>
          h("td", { class: [col.text && "text", col.key === "errors" && a.errors && "err-count"].filter(Boolean).join(" ") || null }, col.fmt(a[col.key]))))))));
}

// Nulls always sort last
function compare(a, b) {
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  return typeof a === "string" ? a.localeCompare(b) : a - b;
}

// ---------- Charts ----------

function renderCharts(agg) {
  state.chartData = [
    { title: "Average cost per call", tip: "The Avg cost column as bars. Hover over a bar for the exact value and how many calls it averages.", fmt: fmtCost, items: agg.map((a) => ({ model: a.model, value: a.avgCost, n: a.costN })) },
    { title: "Average response time", tip: "The Avg time column as bars: seconds per successful call.", fmt: fmtSec, items: agg.map((a) => ({ model: a.model, value: a.avgSec, n: a.secN })) },
    { title: "Average output tokens", tip: "The Avg output tokens column as bars. More output usually means a longer answer and a higher cost.", fmt: fmtInt, items: agg.map((a) => ({ model: a.model, value: a.avgOut, n: a.outN })) },
  ];
  if (agg.some((a) => a.scoreN)) {
    state.chartData.unshift({
      kind: "scatter",
      title: "Accuracy vs cost",
      tip: `One dot per model: its average score (up) against its average cost per scored call (right). Up and to the left is better: more accurate for less. The dashed line is the pass mark (${PASS_SCORE}). Compare models scored on the same prompts, for example one batch.`,
      items: agg.filter((a) => a.avgScore != null && a.avgScoredCost != null)
        .map((a) => ({ model: a.model, x: a.avgScoredCost, y: a.avgScore, n: a.scoreN, passRate: a.passRate })),
    });
    state.chartData.splice(1, 0, {
      title: "Average score", tip: `The Avg score column as bars, out of ${SCORE_MAX}.`, fmt: fmtScore,
      items: agg.map((a) => ({ model: a.model, value: a.avgScore, n: a.scoreN })),
    });
  }
  drawCharts();
}

function drawCharts() {
  const box = $("#charts");
  box.replaceChildren();
  if (!state.chartData.length || !state.chartData.some((c) => c.items.length)) return;
  for (const chart of state.chartData) {
    const fig = h("figure", { class: "chart" }, h("figcaption", { "data-tip": chart.tip }, chart.title));
    box.append(fig);
    if (chart.kind === "scatter") {
      if (chart.items.length) fig.append(scatterChart(fig.clientWidth || 320, chart));
      else fig.append(h("p", { class: "note" }, "No scored model has a cost estimate to plot."));
    } else {
      fig.append(barChart(fig.clientWidth || 320, chart));
    }
  }
}

// Average score (y, fixed 1-5) against average cost (x). Costs between models often differ 100-fold, so x is
// logarithmic when the range is wide enough to squash the cheap models together on a linear scale.
function scatterChart(availableWidth, { title, items }) {
  const padL = 40, padR = 16, padT = 10, axisH = 40;
  const plotW = Math.min(MAX_PLOT_WIDTH, Math.max(160, availableWidth - padL - padR));
  const plotH = 240;
  const width = padL + plotW + padR, height = padT + plotH + axisH;

  const xs = items.map((i) => i.x);
  let lo = Math.min(...xs), hi = Math.max(...xs);
  const useLog = lo > 0 && hi / lo >= 10;
  let fx;
  if (useLog) {
    const a = Math.log10(lo) - 0.15, b = Math.log10(hi) + 0.15;
    fx = (v) => padL + ((Math.log10(v) - a) / (b - a)) * plotW;
    lo = 10 ** a; hi = 10 ** b;
  } else {
    const span = hi - lo || hi || 1;
    lo = Math.max(0, lo - span * 0.1); hi = hi + span * 0.1;
    fx = (v) => padL + ((v - lo) / (hi - lo)) * plotW;
  }
  const fy = (v) => padT + plotH - ((v - 1) / (SCORE_MAX - 1)) * plotH;

  const svg = s("svg", { width, height, viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": `${title}: average score against average cost per model` });

  // Recessive grid: one line per score, the pass mark dashed
  for (let v = 1; v <= SCORE_MAX; v++) {
    svg.append(s("line", { class: v === PASS_SCORE ? "pass-line" : v === 1 ? "baseline" : "gridline", x1: padL, x2: padL + plotW, y1: fy(v), y2: fy(v) }));
    svg.append(s("text", { class: "tick", x: padL - 8, y: fy(v) + 4, "text-anchor": "end" }, String(v)));
  }
  svg.append(s("text", { class: "tick", x: padL + 4, y: fy(PASS_SCORE) - 4 }, "pass"));

  // Cost ticks: each power of ten in range on a log axis, or quarters on a linear one
  const ticks = [];
  if (useLog) {
    for (let p = Math.ceil(Math.log10(lo)); p <= Math.floor(Math.log10(hi)); p++) ticks.push(10 ** p);
    if (ticks.length < 2) ticks.splice(0, ticks.length, lo, Math.sqrt(lo * hi), hi);
  } else {
    for (let i = 0; i <= 4; i++) ticks.push(lo + ((hi - lo) * i) / 4);
  }
  for (const t of ticks) {
    const x = fx(t);
    svg.append(s("line", { class: "gridline", x1: x, x2: x, y1: padT, y2: padT + plotH }));
    svg.append(s("text", { class: "tick", x, y: padT + plotH + 16, "text-anchor": "middle" }, fmtCost(t)));
  }
  svg.append(s("text", { class: "axis-title", x: padL + plotW / 2, y: height - 4, "text-anchor": "middle" },
    `Average cost per scored call${useLog ? " (log scale)" : ""}`));

  // Name labels right of each dot (left near the right edge), dropped when they would overlap one already placed;
  // every dot still has its name in the tooltip
  const placed = [{ x: padL, y: fy(PASS_SCORE) - 15, w: 34, h: 14 }];  // the "pass" label
  const overlaps = (r) => placed.some((p) => r.x < p.x + p.w && p.x < r.x + r.w && r.y < p.y + p.h && p.y < r.y + r.h);
  const points = items.map((item) => ({ item, cx: fx(item.x), cy: fy(item.y) }));
  for (const p of points) placed.push({ x: p.cx - 6, y: p.cy - 6, w: 12, h: 12 });
  for (const { item, cx, cy } of [...points].sort((a, b) => b.item.y - a.item.y)) {
    const w = textWidth(item.model) * (11 / 12);
    const right = cx + 9 + w <= width;
    const box = { x: right ? cx + 9 : cx - 9 - w, y: cy - 8, w, h: 14 };
    if (overlaps(box)) continue;
    placed.push(box);
    svg.append(s("text", { class: "point-label", x: right ? cx + 9 : cx - 9, y: cy + 4, "text-anchor": right ? "start" : "end" }, item.model));
  }

  for (const { item, cx, cy } of points) {
    const g = s("g", { class: "point" }, s("circle", { class: "dot", cx, cy, r: 5 }));
    // Hit target bigger than the dot
    const hit = s("circle", { class: "hit", cx, cy, r: 12, tabindex: 0, "aria-label": `${item.model}: score ${fmtScore(item.y)}, ${fmtCost(item.x)} per call` });
    const tip = () => [item.model, `Score ${fmtScore(item.y)} / ${SCORE_MAX} · ${fmtCost(item.x)} per call`,
      `Pass rate ${fmtPct(item.passRate)} · ${plural(item.n, "scored call")}`];
    hit.addEventListener("mousemove", (e) => showTooltip(tip(), e.clientX, e.clientY));
    hit.addEventListener("mouseleave", hideTooltip);
    hit.addEventListener("focus", () => { const r = hit.getBoundingClientRect(); showTooltip(tip(), r.right, r.top); });
    hit.addEventListener("blur", hideTooltip);
    g.append(hit);
    svg.append(g);
  }
  return svg;
}

const MAX_PLOT_WIDTH = 900;
const measureCtx = document.createElement("canvas").getContext("2d");

// Width of chart text in px, using the same 12px font as the SVG labels
function textWidth(text) {
  measureCtx.font = `12px ${getComputedStyle(document.body).fontFamily}`;
  return measureCtx.measureText(text).width;
}

function barChart(availableWidth, { title, fmt, items }) {
  const band = 30, barH = 18, axisH = 22;
  const labelW = Math.min(140, Math.max(90, availableWidth * 0.36));
  const values = items.map((i) => i.value).filter((v) => v != null);
  const max = values.length ? Math.max(...values) : 0;
  // Room after the longest bar for its value label, sized to the widest label so it never spills past the chart
  const valueW = Math.ceil(Math.max(0, ...values.map((v) => textWidth(fmt(v))))) + 16;
  const plotX = labelW;
  // Capped so bars stay easy to read against their labels on wide screens
  const plotW = Math.min(MAX_PLOT_WIDTH, Math.max(40, availableWidth - labelW - valueW));
  const width = labelW + plotW + valueW;
  const height = items.length * band + axisH;
  const scale = (v) => (max > 0 ? (v / max) * plotW : 0);

  const svg = s("svg", { width, height, viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": `${title} by model` });

  // Recessive grid: quarter marks, with the zero line as the baseline
  for (let i = 1; i <= 4; i++) {
    const x = plotX + (plotW * i) / 4;
    svg.append(s("line", { class: "gridline", x1: x, x2: x, y1: 0, y2: items.length * band }));
  }
  svg.append(s("line", { class: "baseline", x1: plotX, x2: plotX, y1: 0, y2: items.length * band }));
  svg.append(s("text", { class: "tick", x: plotX, y: height - 6, "text-anchor": "start" }, fmt(0)));
  if (max > 0) svg.append(s("text", { class: "tick", x: plotX + plotW, y: height - 6, "text-anchor": "end" }, fmt(max)));

  const maxChars = Math.floor((labelW - 10) / 7);
  items.forEach((item, i) => {
    const y = i * band;
    const barY = y + (band - barH) / 2;
    const w = item.value != null ? scale(item.value) : 0;
    const label = item.model.length > maxChars ? item.model.slice(0, maxChars - 1) + "…" : item.model;
    const row = s("g", { class: "row" },
      s("rect", { class: "hover-bg", x: 0, y, width, height: band, rx: 4 }),
      s("text", { class: "label", x: labelW - 8, y: y + band / 2 + 4, "text-anchor": "end" }, label),
      item.value != null && w > 0 ? s("path", { class: "bar", d: barPath(plotX, barY, w, barH, 4) }) : null,
      item.value != null
        ? s("text", { class: "value", x: plotX + w + 6, y: y + band / 2 + 4 }, fmt(item.value))
        : s("text", { class: "muted", x: plotX + 6, y: y + band / 2 + 4 }, "no data"),
    );
    // Hit target covers the whole row, larger than the bar itself
    const hit = s("rect", { class: "hit", x: 0, y, width, height: band, tabindex: 0, "aria-label": `${item.model}: ${fmt(item.value)}` });
    const tip = () => [item.model, item.value != null ? fmt(item.value) : "No data", `Based on ${plural(item.n, "call")}`];
    hit.addEventListener("mousemove", (e) => showTooltip(tip(), e.clientX, e.clientY));
    hit.addEventListener("mouseleave", hideTooltip);
    hit.addEventListener("focus", () => {
      const r = hit.getBoundingClientRect();
      showTooltip(tip(), r.left + plotX + w, r.top);
    });
    hit.addEventListener("blur", hideTooltip);
    row.append(hit);
    svg.append(row);
  });
  return svg;
}

// Square at the baseline, 4px rounded at the data end
function barPath(x, y, w, hgt, r) {
  r = Math.min(r, w, hgt / 2);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt - r}Q${x + w},${y + hgt} ${x + w - r},${y + hgt}H${x}Z`;
}

function showTooltip([title, value, sub], x, y) {
  const t = $("#tooltip");
  t.replaceChildren(h("strong", {}, title), h("div", { class: "num" }, value), h("div", { class: "tt-sub" }, sub));
  t.style.display = "block";
  const pad = 12;
  const left = Math.min(x + pad, window.innerWidth - t.offsetWidth - pad);
  const top = y - t.offsetHeight - pad < 0 ? y + pad : y - t.offsetHeight - pad;
  t.style.left = Math.max(pad, left) + "px";
  t.style.top = top + "px";
}
function hideTooltip() {
  $("#tooltip").style.display = "none";
}

// ---------- Runs ----------

function groupRuns(rows) {
  const runs = new Map();
  for (const r of rows) {
    if (!runs.has(r.runId)) runs.set(r.runId, []);
    runs.get(r.runId).push(r);
  }
  const list = [...runs.entries()].map(([runId, rs]) => ({
    runId,
    rows: rs,
    date: rs[0].date,
    cost: rs.reduce((a, r) => a + (r.totalCost || 0), 0),
  }));
  const time = (run) => (run.date ? run.date.getTime() : run.runId);
  if (state.runSort === "newest") list.sort((a, b) => time(b) - time(a) || b.runId - a.runId);
  else if (state.runSort === "oldest") list.sort((a, b) => time(a) - time(b) || a.runId - b.runId);
  else list.sort((a, b) => b.cost - a.cost);
  return list;
}

function renderRuns(rows) {
  const box = $("#runs");
  const runs = groupRuns(rows);
  $("#runs-title").textContent = `Runs (${runs.length.toLocaleString()})`;
  if (!runs.length) {
    box.replaceChildren(h("p", { class: "empty" }, state.entries.length ? "No runs match the filters." : "No runs to show."));
    return;
  }
  const shown = runs.slice(0, state.runLimit);
  box.replaceChildren(...shown.map(runCard));
  if (runs.length > shown.length) {
    const more = Math.min(50, runs.length - shown.length);
    box.append(h("button", { class: "btn", type: "button", onclick: () => { state.runLimit += 50; renderRuns(filteredRows()); } },
      `Show ${more} more of ${runs.length - shown.length} remaining`));
  }
}

function runCard(run) {
  const { runId, rows } = run;
  const entry = state.entries[runId] || {};
  const first = rows[0];
  const open = state.expanded.has(runId);
  const total = Array.isArray(entry.results) ? entry.results.filter(isResult).length : rows.length;
  const errors = rows.filter((r) => r.error).length;
  const hasCost = rows.some((r) => r.totalCost != null);
  const typeLabel = { evaluate_all_models: "All models", evaluate: "Single model", chat: "Chat page", batch: "Batch case" }[first.type] || first.type;
  const scores = rows.filter((r) => !r.error && r.score != null).map((r) => r.score);
  const modelsLabel = rows.length === 1 && total === 1 ? first.model
    : rows.length === total ? plural(total, "model") : `${rows.length} of ${total} models`;

  const card = h("article", { class: "run" });
  const head = h("button", {
    class: "run-head", type: "button", "aria-expanded": String(open),
    onclick: () => {
      if (state.expanded.has(runId)) state.expanded.delete(runId);
      else state.expanded.add(runId);
      card.replaceWith(runCard(run));
    },
  },
    h("span", { class: "chev", "aria-hidden": "true" }, "▸"),
    h("span", { class: "run-time" }, fmtDate(first.date, first.timestamp)),
    h("span", { class: "badge" }, typeLabel),
    h("span", { class: "run-models" }, modelsLabel),
    first.caseId != null ? h("span", { class: "run-models" }, `case ${first.caseId}`) : null,
    errors ? h("span", { class: "badge badge-error" }, `⚠ ${plural(errors, "error")}`) : null,
    scores.length ? h("span", { class: "badge badge-score" },
      `${scores.length === 1 ? "score" : "avg score"} ${scores.length === 1 ? scores[0] : fmtScore(scores.reduce((a, b) => a + b, 0) / scores.length)}/${SCORE_MAX}`) : null,
    h("span", { class: "run-cost" }, hasCost ? fmtCost(run.cost) : "—"),
  );

  const body = h("div", { class: "run-body" });
  if (first.batchId != null) {
    const filtered = state.filters.batch === first.batchId;
    body.append(h("div", { class: "session-line" },
      h("span", { "data-tip": "This run is one case of an evaluate_batch() batch. Every case of that batch has the same batch id.", style: "cursor: help" },
        "Batch ", h("code", {}, first.batchId), first.caseId != null ? ` · case ${first.caseId}` : ""),
      filtered ? null : h("button", { class: "btn-link", type: "button", "data-tip": "Filter the page to just this batch's cases. Use the Batch filter or Clear filters to go back.", onclick: () => setBatchFilter(first.batchId) }, "Show only this batch"),
    ));
  }
  if (first.sessionId != null) {
    // Outside the head button, as a button can't hold another one
    const filtered = state.filters.session === first.sessionId;
    body.append(h("div", { class: "session-line" },
      h("span", { "data-tip": "This turn belongs to a chat page conversation. Every turn of that conversation has the same session id.", style: "cursor: help" },
        "Session ", h("code", {}, first.sessionId), first.turn != null ? ` · turn ${first.turn}` : ""),
      first.sessionTotal != null
        ? h("span", { "data-tip": "What the conversation had cost up to and including this turn.", style: "cursor: help" }, `session total so far ${fmtCost(first.sessionTotal)}`)
        : null,
      filtered ? null : h("button", { class: "btn-link", type: "button", "data-tip": "Filter the page to just this conversation's turns. Use the Chat session filter or Clear filters to go back.", onclick: () => setSessionFilter(first.sessionId) }, "Show only this session"),
    ));
  }
  body.append(h("p", { class: open ? "prompt" : "prompt clamp" }, first.prompt || (first.attachments.length ? "(attachments only)" : "(no prompt)")));
  if (first.attachments.length) {
    body.append(h("p", { class: "session-line", "data-tip": "Files sent with this prompt. The log keeps only their names, types and sizes, not their contents." },
      `Attachments: ${first.attachments.join(" · ")}`));
  }
  if (first.contextFiles.length) {
    body.append(h("p", { class: "session-line", "data-tip": "Context files for the whole chat conversation, sent to every model on every turn. The log keeps only their names, types and sizes." },
      `Context files: ${first.contextFiles.join(" · ")}`));
  }
  if (open) {
    if (first.system) body.append(h("div", { class: "label-sm" }, "System prompt"), h("p", { class: "prompt" }, first.system));
    if (first.expected) body.append(h("div", { class: "label-sm" }, "Expected answer"), h("p", { class: "expected" }, first.expected));
    if (first.rubric) body.append(h("div", { class: "label-sm" }, "Rubric"), h("p", { class: "expected" }, first.rubric));
    const single = rows.length === 1;
    body.append(h("div", { class: single ? "results single" : "results" }, rows.map((r) => resultView(r, single))));
  }
  card.append(head, body);
  return card;
}

function resultView(r, single) {
  const u = r.usage || {};
  const metric = (label, value) => h("div", {}, h("dt", {}, label), h("dd", {}, value));
  const metrics = [
    metric("Time", fmtSec(r.seconds)),
    metric("Input", fmtInt(num(u.input_tokens))),
    metric("Output", fmtInt(num(u.output_tokens))),
    metric("Cost", fmtCost(r.totalCost)),
  ];
  // Already counted in Output; shown so OpenAI output totals can be read against Claude's
  if (num(u.reasoning_tokens)) metrics.push(metric("Reasoning", fmtInt(u.reasoning_tokens)));
  if (num(u.cache_read_input_tokens)) metrics.push(metric("Cache read", fmtInt(u.cache_read_input_tokens)));
  if (num(u.cache_creation_input_tokens)) metrics.push(metric("Cache write", fmtInt(u.cache_creation_input_tokens)));
  if (single && r.cost) {
    metrics.push(
      metric("Input cost", fmtCost(num(r.cost.input_cost))),
      metric("Output cost", fmtCost(num(r.cost.output_cost))),
      metric("Cache cost", fmtCost((num(r.cost.cache_write_cost) || 0) + (num(r.cost.cache_read_cost) || 0))),
    );
  }
  const scorerLabel = r.scorer === "llm_judge" ? `grader ${r.judgeModel || ""}`.trim() : r.scorer || "scorer";
  let scoreBadge = null, grade = null;
  if (!r.error && r.scored) {
    if (r.score != null) {
      const pass = r.score >= PASS_SCORE;
      scoreBadge = h("span", { class: pass ? "badge badge-score" : "badge badge-score badge-muted", "data-tip": `Scored by ${scorerLabel}. ${PASS_SCORE} or more out of ${SCORE_MAX} is a pass.` },
        `${r.score}/${SCORE_MAX} ${pass ? "✓ pass" : "✗ fail"}`);
    }
    if (r.scoreError) {
      grade = h("div", { class: "grade failed" }, h("strong", {}, "⚠ Grading failed: "), r.scoreError);
    } else if (r.reasoning || r.judgeCost != null) {
      grade = h("div", { class: "grade" }, h("strong", {}, "Grader: "), r.reasoning || "(no reasoning)",
        r.judgeCost != null ? ` · ${fmtCost(r.judgeCost)} to grade` : "");
    }
  }
  return h("article", { class: "result" },
    h("div", { class: "result-head" },
      h("strong", {}, r.model),
      scoreBadge,
      r.stopReason && !NORMAL_STOPS.has(r.stopReason) ? h("span", { class: "badge" }, r.stopReason) : null),
    r.error ? null : h("dl", { class: "metrics" }, metrics),
    r.error
      ? h("div", { class: "error-box", role: "note" }, h("strong", {}, "⚠ Error: "), r.error)
      : h("div", { class: "response" }, r.response || "(empty response)"),
    grade);
}

  ["case_id", (r) => r.caseId],
  ["expected", (r) => r.expected],

  ["scorer", (r) => r.scorer],
  ["judge_model", (r) => r.judgeModel],
  ["judge_cost", (r) => r.judgeCost],
  ["score_reasoning", (r) => r.reasoning],
  ["score_error", (r) => r.scoreError],
  ["response", (r) => r.response],
];

function csvCell(v) {
  if (v == null) return "";
  let text = String(v);
  // Stop spreadsheets from running text cells as formulas
  if (typeof v === "string" && /^[=+\-@\t\r]/.test(text)) text = "'" + text;
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function exportCsv() {
  const rows = filteredRows();
  if (!rows.length) {
    showNotice("Nothing to export: no model calls match the filters.");
    return;
  }
  const lines = [CSV_COLUMNS.map(([name]) => name).join(",")];
  for (const r of rows) lines.push(CSV_COLUMNS.map(([, get]) => csvCell(get(r))).join(","));
  // BOM so Excel reads the file as UTF-8
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = h("a", { href: URL.createObjectURL(blob), download: `eval_log_${localDay(new Date())}.csv` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Theme ----------

function currentTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  if (set) return set;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function updateThemeButton() {
  $("#theme").textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode";
}
function initTheme() {
  try {
    const saved = localStorage.getItem("eval-log-viewer-theme");
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { /* storage unavailable: follow the system setting */ }
  updateThemeButton();
  $("#theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("eval-log-viewer-theme", next); } catch (e) { /* not saved */ }
    updateThemeButton();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeButton);
}

let dragDepth = 0;
window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("#drop").classList.add("show"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("#drop").classList.remove("show"); } });

window.addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  $("#drop").classList.remove("show");
  const file = e.dataTransfer.files[0];
  if (file) loadFromFile(file);
});

// Redraw only on width changes: redrawing changes the height, which would otherwise retrigger the observer
let resizeFrame = 0, chartsWidth = 0;
new ResizeObserver((entries) => {
  const width = Math.round(entries[0].contentRect.width);
  if (width === chartsWidth) return;
  chartsWidth = width;
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(drawCharts);
}).observe($("#charts"));

// ---------- Explanations (data-tip) ----------
// Any element with data-tip shows it in a bubble on hover or keyboard focus; Escape, scrolling or moving away hides it.
// Separate from the chart tooltip, which follows the mouse over bars.

const tipBubble = h("div", { class: "tip-bubble", id: "tip-bubble", role: "tooltip" });
document.body.append(tipBubble);
let tipTarget = null;

function showTip(target) {
  const text = target.getAttribute("data-tip");
  if (!text) return;
  if (tipTarget && tipTarget !== target) tipTarget.removeAttribute("aria-describedby");
  tipTarget = target;
  target.setAttribute("aria-describedby", "tip-bubble");
  tipBubble.textContent = text;
  tipBubble.style.display = "block";
  const r = target.getBoundingClientRect();
  const w = tipBubble.offsetWidth, ht = tipBubble.offsetHeight;
  const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
  let top = r.bottom + 8;
  if (top + ht > window.innerHeight - 8) top = Math.max(8, r.top - ht - 8);
  tipBubble.style.left = left + "px";
  tipBubble.style.top = top + "px";
}

function hideTip() {
  if (tipTarget) tipTarget.removeAttribute("aria-describedby");
  tipTarget = null;
  tipBubble.style.display = "none";
}

document.addEventListener("mouseover", (e) => {
  const t = e.target.closest("[data-tip]");
  if (t) { if (t !== tipTarget) showTip(t); }
  else if (tipTarget && !tipTarget.contains(document.activeElement)) hideTip();
});
document.addEventListener("focusin", (e) => {
  const t = e.target.closest("[data-tip]");
  if (t) showTip(t); else hideTip();
});
document.addEventListener("focusout", (e) => { if (tipTarget && tipTarget.contains(e.target)) hideTip(); });
// A tap on an ⓘ shows its text on touch screens, which have no hover
document.addEventListener("click", (e) => { const t = e.target.closest(".info[data-tip]"); if (t) showTip(t); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
window.addEventListener("scroll", hideTip, { capture: true, passive: true });
window.addEventListener("resize", hideTip);

initTheme();
// ?session=<id> opens the viewer on one chat conversation (the chat page links here)
const sessionParam = new URLSearchParams(location.search).get("session");
if (sessionParam) state.filters.session = sessionParam;
loadFromServer();
</script>
</body>
</html>
