[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "model-evaluator"
version = "0.1.0"
description = "Compare LLMs from Anthropic, OpenAI and OpenRouter on cost and accuracy, with an LLM judge, batch runs and a local web UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ranveer Singh" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "openai>=3.37",
    "python-dotenv>=1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "nbstripout>=0.8",
]

[project.scripts]
model-eval = "model_evaluator.cli:main"

[project.urls]
Repository = "https://github.com/ranveer-singh-10/APIModelEvaluatorTool"

[tool.hatch.build.targets.wheel]
packages = ["src/model_evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# The scratch notebook uses `from model_evaluator import *` on purpose
extend-exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "A", "BLE"]
